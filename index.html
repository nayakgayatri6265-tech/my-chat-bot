
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Groq AI Chatbot</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #dbeafe, #ede9fe);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 15px;
    }

    .chat-container {
      width: 100%;
      max-width: 750px;
      height: 85vh;
      min-height: 450px;
      background: white;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 15px 45px #0002;
      display: flex;
      flex-direction: column;
    }

    .header {
      padding: 20px;
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      color: white;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .avatar {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      background: white;
      display: grid;
      place-items: center;
      font-size: 25px;
    }

    .header-info {
      flex: 1;
    }

    .header-info h2 {
      font-size: 20px;
      margin-bottom: 5px;
    }

    .header-info p {
      font-size: 12px;
    }

    .clear-btn {
      padding: 9px 12px;
      color: white;
      background: transparent;
      border: 1px solid #ffffff80;
      border-radius: 8px;
      cursor: pointer;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      background: #f8fafc;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .message {
      display: flex;
      align-items: flex-start;
      gap: 9px;
      max-width: 90%;
    }

    .message.user {
      align-self: flex-end;
      flex-direction: row-reverse;
    }

    .message.bot {
      align-self: flex-start;
    }

    .message-avatar {
      width: 32px;
      height: 32px;
      min-width: 32px;
      display: grid;
      place-items: center;
      background: #e0e7ff;
      border-radius: 50%;
    }

    .bubble {
      padding: 12px 15px;
      border-radius: 15px;
      font-size: 14px;
      line-height: 1.6;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .bot .bubble {
      background: white;
      color: #1e293b;
      border: 1px solid #e2e8f0;
      border-top-left-radius: 4px;
    }

    .user .bubble {
      background: #4f46e5;
      color: white;
      border-top-right-radius: 4px;
    }

    .timestamp {
      font-size: 10px;
      color: #94a3b8;
      margin-top: 5px;
      display: block;
    }

    .user .timestamp {
      text-align: right;
    }

    .quick-replies {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 10px 15px;
      background: #f8fafc;
    }

    .quick-replies button {
      padding: 8px 12px;
      border: 1px solid #c7d2fe;
      border-radius: 20px;
      background: white;
      color: #4f46e5;
      cursor: pointer;
    }

    .input-area {
      display: flex;
      gap: 10px;
      padding: 15px;
      border-top: 1px solid #e2e8f0;
    }

    #userInput {
      flex: 1;
      min-width: 0;
      padding: 14px 17px;
      border: 1px solid #cbd5e1;
      border-radius: 25px;
      outline: none;
      font-size: 14px;
    }

    #userInput:focus {
      border-color: #4f46e5;
    }

    #sendBtn {
      width: 48px;
      height: 48px;
      border: none;
      border-radius: 50%;
      color: white;
      background: #4f46e5;
      font-size: 20px;
      cursor: pointer;
    }

    #sendBtn:disabled {
      opacity: 0.5;
      cursor: wait;
    }

    .status {
      padding: 0 16px 10px;
      background: white;
      color: #64748b;
      font-size: 12px;
    }

    @media (max-width: 500px) {
      body {
        padding: 0;
      }

      .chat-container {
        height: 100vh;
        height: 100dvh;
        min-height: 0;
        border-radius: 0;
      }
    }
  </style>
</head>

<body>

  <div class="chat-container">

    <header class="header">
      <div class="avatar">🤖</div>

      <div class="header-info">
        <h2>Groq AI Chatbot</h2>
        <p>AI assistant · Ready to help</p>
      </div>

      <button class="clear-btn" id="clearBtn" type="button">
        Clear
      </button>
    </header>

    <main class="messages" id="messages" aria-live="polite">
      <div class="message bot">
        <div class="message-avatar">🤖</div>
        <div>
          <div class="bubble">Hello! 👋 Welcome to Groq AI Chatbot.

Ask me anything! I can help with coding, education, writing, ideas, and more.</div>
          <span class="timestamp">Just now</span>
        </div>
      </div>
    </main>

    <div class="quick-replies">
      <button type="button" data-message="Hello!">👋 Hello</button>
      <button type="button" data-message="Explain JavaScript simply">💻 Coding</button>
      <button type="button" data-message="Tell me a joke">😄 Joke</button>
    </div>

    <div class="status" id="status">
      Powered by Groq API
    </div>

    <form class="input-area" id="chatForm">
      <input
        id="userInput"
        type="text"
        placeholder="Type your message..."
        autocomplete="off"
        maxlength="4000"
        required
      >
      <button id="sendBtn" type="submit">➤</button>
    </form>

  </div>

  <script>
    // 1. Add your Groq API key here.
    // WARNING: This exposes the key in browser code.
    const GROQ_API_KEY = "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";

    // 2. Groq chat-completions endpoint.
    const API_URL =
      "https://api.groq.com/openai/v1/chat/completions";

    // 3. Choose a model available to your Groq account.
    const MODEL = "llama-3.3-70b-versatile";

    const messagesEl = document.getElementById("messages");
    const chatForm = document.getElementById("chatForm");
    const userInput = document.getElementById("userInput");
    const sendBtn = document.getElementById("sendBtn");
    const clearBtn = document.getElementById("clearBtn");
    const statusEl = document.getElementById("status");

    let conversation = [];
    let isLoading = false;
    let activeController = null;

    function scrollToBottom() {
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function addMessage(text, role) {
      const row = document.createElement("div");
      row.className = "message " + role;

      const avatar = document.createElement("div");
      avatar.className = "message-avatar";
      avatar.textContent = role === "bot" ? "🤖" : "🙂";

      const content = document.createElement("div");

      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = text;

      const timestamp = document.createElement("span");
      timestamp.className = "timestamp";
      timestamp.textContent = new Date().toLocaleTimeString([], {
        hour: "2-digit",
        minute: "2-digit"
      });

      content.append(bubble, timestamp);
      row.append(avatar, content);
      messagesEl.appendChild(row);

      scrollToBottom();
    }

    async function sendMessage(text) {
      text = text.trim();

      if (!text || isLoading) return;

      if (
        !GROQ_API_KEY ||
        GROQ_API_KEY === "PASTE_YOUR_GROQ_API_KEY_HERE"
      ) {
        addMessage(
          "Please add your Groq API key in the JavaScript code first.",
          "bot"
        );
        return;
      }

      addMessage(text, "user");
      userInput.value = "";
      isLoading = true;
      sendBtn.disabled = true;
      userInput.disabled = true;
      statusEl.textContent = "AI is thinking...";

      const pendingConversation = [
        ...conversation,
        { role: "user", content: text }
      ].slice(-20);

      activeController = new AbortController();

      // Add a typing indicator.
      const typing = document.createElement("div");
      typing.className = "message bot";
      typing.id = "typingIndicator";
      typing.innerHTML =
        '<div class="message-avatar">🤖</div>' +
        '<div class="bubble">Thinking... ⏳</div>';

      messagesEl.appendChild(typing);
      scrollToBottom();

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          signal: activeController.signal,
          headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + GROQ_API_KEY
          },
          body: JSON.stringify({
            model: MODEL,
            messages: [
              {
                role: "system",
                content:
                  "You are a friendly, helpful AI assistant. " +
                  "Answer clearly and accurately. Use plain text " +
                  "and readable formatting."
              },
              ...pendingConversation
            ],
            temperature: 0.7,
            max_tokens: 1024
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(
            data.error?.message ||
            "API request failed with status " + response.status
          );
        }

        const reply = data.choices?.[0]?.message?.content;

        if (typeof reply !== "string" || !reply.trim()) {
          throw new Error("The AI returned an empty response.");
        }

        conversation = [
          ...pendingConversation,
          { role: "assistant", content: reply }
        ].slice(-20);

        typing.remove();
        addMessage(reply, "bot");
        statusEl.textContent = "Powered by Groq API · Ready";

      } catch (error) {
        typing.remove();

        if (error.name !== "AbortError") {
          addMessage(
            "Sorry, I couldn't get a response.\n\n" +
            error.message +
            "\n\nCheck your API key, model name, network, and API limits.",
            "bot"
          );

          statusEl.textContent = "Error · Please try again";
        }
      } finally {
        activeController = null;
        isLoading = false;
        sendBtn.disabled = false;
        userInput.disabled = false;
        userInput.focus();
      }
    }

    chatForm.addEventListener("submit", function(event) {
      event.preventDefault();
      sendMessage(userInput.value);
    });

    document.querySelectorAll("[data-message]").forEach(button => {
      button.addEventListener("click", () => {
        sendMessage(button.dataset.message);
      });
    });

    clearBtn.addEventListener("click", () => {
      if (activeController) {
        activeController.abort();
      }

      conversation = [];
      messagesEl.replaceChildren();

      addMessage(
        "Chat cleared! 🧹 Hello again! What can I help you with?",
        "bot"
      );

      statusEl.textContent = "Powered by Groq API · Ready";
    });

    userInput.focus();
  </script>

</body>
</html>
