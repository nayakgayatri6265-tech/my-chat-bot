 
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My AI Chatbot</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #667eea, #764ba2);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 15px;
}

.chat-container {
  width: 100%;
  max-width: 750px;
  height: 90vh;
  background: white;
  border-radius: 20px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  box-shadow: 0 15px 45px #0003;
}

.header {
  background: linear-gradient(135deg, #4f46e5, #7c3aed);
  color: white;
  padding: 20px;
  display: flex;
  align-items: center;
  gap: 12px;
}

.avatar {
  font-size: 35px;
}

.header-info {
  flex: 1;
}

.header-info h2 {
  font-size: 20px;
  margin-bottom: 5px;
}

.header-info p {
  font-size: 12px;
  opacity: 0.9;
}

.clear-btn {
  padding: 9px 12px;
  border: 1px solid white;
  border-radius: 8px;
  background: transparent;
  color: white;
  cursor: pointer;
}

.messages {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
  background: #f8fafc;
  display: flex;
  flex-direction: column;
  gap: 15px;
}

.message {
  max-width: 90%;
  display: flex;
  gap: 10px;
}

.message.user {
  align-self: flex-end;
  flex-direction: row-reverse;
}

.message.bot {
  align-self: flex-start;
}

.message-avatar {
  width: 32px;
  height: 32px;
  min-width: 32px;
  background: #e0e7ff;
  border-radius: 50%;
  display: grid;
  place-items: center;
}

.bubble {
  padding: 12px 15px;
  border-radius: 15px;
  font-size: 14px;
  line-height: 1.6;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.bot .bubble {
  background: white;
  color: #1e293b;
  border: 1px solid #e2e8f0;
  border-top-left-radius: 4px;
}

.user .bubble {
  background: #4f46e5;
  color: white;
  border-top-right-radius: 4px;
}

.timestamp {
  display: block;
  font-size: 10px;
  color: #94a3b8;
  margin-top: 5px;
}

.user .timestamp {
  text-align: right;
}

.quick-replies {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  padding: 12px 15px;
  background: #f8fafc;
}

.quick-replies button {
  padding: 8px 12px;
  border: 1px solid #c7d2fe;
  border-radius: 20px;
  background: white;
  color: #4f46e5;
  cursor: pointer;
}

.api-area {
  display: flex;
  gap: 8px;
  padding: 12px 15px;
  border-top: 1px solid #e2e8f0;
}

.api-area input {
  flex: 1;
  min-width: 0;
  padding: 10px;
  border: 1px solid #cbd5e1;
  border-radius: 8px;
}

.api-area button {
  padding: 10px 12px;
  background: #4f46e5;
  color: white;
  border: none;
  border-radius: 8px;
  cursor: pointer;
}

.input-area {
  display: flex;
  gap: 10px;
  padding: 15px;
  border-top: 1px solid #e2e8f0;
}

#userInput {
  flex: 1;
  min-width: 0;
  padding: 14px 17px;
  border: 1px solid #cbd5e1;
  border-radius: 25px;
  outline: none;
  font-size: 14px;
}

#sendBtn {
  width: 48px;
  height: 48px;
  border: none;
  border-radius: 50%;
  color: white;
  background: #4f46e5;
  font-size: 20px;
  cursor: pointer;
}

#sendBtn:disabled {
  opacity: 0.5;
  cursor: wait;
}

.status {
  padding: 0 15px 10px;
  background: white;
  color: #64748b;
  font-size: 12px;
}

@media (max-width: 500px) {
  body {
    padding: 0;
  }

  .chat-container {
    height: 100vh;
    height: 100dvh;
    border-radius: 0;
  }
}
</style>
</head>

<body>

<div class="chat-container">

  <header class="header">
    <div class="avatar">🤖</div>

    <div class="header-info">
      <h2>My AI Chatbot</h2>
      <p>AI assistant · Ready to help</p>
    </div>

    <button class="clear-btn" id="clearBtn">
      Clear
    </button>
  </header>

  <main class="messages" id="messages" aria-live="polite">
    <div class="message bot">
      <div class="message-avatar">🤖</div>
      <div>
        <div class="bubble">
Hello! 👋 Welcome to My AI Chatbot.

Ask me anything! I can help with coding, education, writing and more.
        </div>
      </div>
    </div>
  </main>

  <div class="quick-replies">
    <button data-message="Hello!">👋 Hello</button>
    <button data-message="Explain JavaScript simply">💻 Coding</button>
    <button data-message="Tell me a joke">😄 Joke</button>
  </div>

  <div class="api-area">
    <input
      type="password"
      id="apiKey"
      placeholder="Enter your Groq API key"
      autocomplete="off"
    >
    <button id="saveKey">Use key</button>
  </div>

  <div class="status" id="status">
    Enter your Groq API key to start chatting.
  </div>

  <form class="input-area" id="chatForm">
    <input
      id="userInput"
      type="text"
      placeholder="Type your message..."
      autocomplete="off"
      maxlength="4000"
      required
    >
    <button id="sendBtn" type="submit">➤</button>
  </form>

</div>

<script>
const API_URL =
  "https://api.groq.com/openai/v1/chat/completions";

// Change this if the model is unavailable to your account.
const MODEL = "openai/gpt-oss-120b";

const messagesEl = document.getElementById("messages");
const chatForm = document.getElementById("chatForm");
const userInput = document.getElementById("userInput");
const sendBtn = document.getElementById("sendBtn");
const clearBtn = document.getElementById("clearBtn");
const statusEl = document.getElementById("status");
const apiKeyInput = document.getElementById("apiKey");
const saveKeyBtn = document.getElementById("saveKey");

let apiKey = "";
let conversation = [];
let isLoading = false;
let activeController = null;

// Save API key only in memory.
saveKeyBtn.addEventListener("click", () => {
  const key = apiKeyInput.value.trim();

  if (!key) {
    statusEl.textContent = "Please enter your Groq API key.";
    return;
  }

  apiKey = key;
  apiKeyInput.value = "";

  statusEl.textContent = "API key entered. You can start chatting!";
  userInput.focus();
});

function scrollToBottom() {
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function addMessage(text, role) {
  const row = document.createElement("div");
  row.className = "message " + role;

  const avatar = document.createElement("div");
  avatar.className = "message-avatar";
  avatar.textContent = role === "bot" ? "🤖" : "🙂";

  const content = document.createElement("div");

  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.textContent = text;

  const timestamp = document.createElement("span");
  timestamp.className = "timestamp";
  timestamp.textContent = new Date().toLocaleTimeString([], {
    hour: "2-digit",
    minute: "2-digit"
  });

  content.append(bubble, timestamp);
  row.append(avatar, content);
  messagesEl.appendChild(row);

  scrollToBottom();
}

async function sendMessage(text) {
  text = text.trim();

  if (!text || isLoading) return;

  if (!apiKey) {
    addMessage(
      "Please enter your Groq API key in the API key field first.",
      "bot"
    );
    return;
  }

  addMessage(text, "user");
  userInput.value = "";

  isLoading = true;
  sendBtn.disabled = true;
  userInput.disabled = true;

  statusEl.textContent = "AI is thinking...";

  const pendingConversation = [
    ...conversation,
    { role: "user", content: text }
  ].slice(-20);

  activeController = new AbortController();

  const typing = document.createElement("div");
  typing.className = "message bot";
  typing.id = "typingIndicator";

  const typingAvatar = document.createElement("div");
  typingAvatar.className = "message-avatar";
  typingAvatar.textContent = "🤖";

  const typingBubble = document.createElement("div");
  typingBubble.className = "bubble";
  typingBubble.textContent = "Thinking... ⏳";

  typing.append(typingAvatar, typingBubble);
  messagesEl.appendChild(typing);

  scrollToBottom();

  try {
    const response = await fetch(API_URL, {
      method: "POST",
      signal: activeController.signal,

      headers: {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + apiKey
      },

      body: JSON.stringify({
        model: MODEL,

        messages: [
          {
            role: "system",
            content:
              "You are a friendly and helpful AI assistant. " +
              "Answer clearly and accurately. " +
              "Use readable formatting."
          },
          ...pendingConversation
        ],

        temperature: 0.7,
        max_tokens: 1024
      })
    });

    const data = await response.json();

    if (!response.ok) {
      const errorMessage =
        data.error?.message || "API request failed.";

      if (response.status === 401) {
        throw new Error(
          "Invalid API key. Generate a new key from Groq Console."
        );
      }

      if (response.status === 404) {
        throw new Error(
          "Model not found. Check the model name in Groq Console."
        );
      }

      throw new Error(errorMessage);
    }

    const reply = data.choices?.[0]?.message?.content;

    if (!reply || !reply.trim()) {
      throw new Error("The AI returned an empty response.");
    }

    conversation = [
      ...pendingConversation,
      { role: "assistant", content: reply }
    ].slice(-20);

    typing.remove();

    addMessage(reply, "bot");

    statusEl.textContent = "Powered by Groq API · Ready";

  } catch (error) {
    typing.remove();

    if (error.name !== "AbortError") {
      addMessage(
        "Sorry, I couldn't get a response.\n\n" +
        error.message +
        "\n\nCheck your API key, model name, network, and API limits.",
        "bot"
      );

      statusEl.textContent = "Error · Please try again";
    }

  } finally {
    activeController = null;
    isLoading = false;

    sendBtn.disabled = false;
    userInput.disabled = false;

    userInput.focus();
  }
}

// Send message using the form.
chatForm.addEventListener("submit", function(event) {
  event.preventDefault();
  sendMessage(userInput.value);
});

// Quick reply buttons.
document.querySelectorAll("[data-message]").forEach(button => {
  button.addEventListener("click", () => {
    sendMessage(button.dataset.message);
  });
});

// Clear chat.
clearBtn.addEventListener("click", () => {
  if (activeController) {
    activeController.abort();
  }

  conversation = [];
  messagesEl.replaceChildren();

  addMessage(
    "Chat cleared! 🧹 Hello again! What can I help you with?",
    "bot"
  );

  statusEl.textContent = "Powered by Groq API · Ready";
});

userInput.focus();
</script>

</body>
</html>
